version: '3.8'

services:
  proxy-flow:
    image: ghcr.io/rfym21/proxy-flow:latest
    container_name: proxy-flow
    ports:
      - "8280:8280"   # HTTP/SOCKS5 统一端口
      - "8281:8281"   # API 服务端口（可选）
    volumes:
      # 挂载代理列表文件
      - ./proxy.txt:/app/proxy.txt
      # 挂载失效代理文件
      - ./failure-proxy.txt:/app/failure-proxy.txt
    environment:
      # ==================== 代理服务配置 ====================
      - PROXY_PORT=8280
      - PROXY_FILE=proxy.txt
      - FAILURE_PROXY_FILE=failure-proxy.txt
      - MAX_IDLE_CONNS=1000
      - MAX_IDLE_CONNS_PER_HOST=100
      - MAX_RETRY_COUNT=3
      - REQUEST_TIMEOUT=30
      # 认证配置（可选，留空则无认证，HTTP和SOCKS5共用）
      - AUTH_USERNAME=
      - AUTH_PASSWORD=
      # 访问日志（设为 false 关闭每连接/每请求日志）
      - ACCESS_LOG=true
      # ==================== API 服务配置 ====================
      - API_ENABLED=false
      - API_PORT=8281
      - API_KEY=
      - CHECK_URL=https://www.google.com
      - CHECK_RETRY=5
    restart: unless-stopped
