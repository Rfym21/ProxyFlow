services:
  warp:
    # ProxyFlow shares this namespace; its configured upstream proxies egress through WARP.
    image: caomingjun/warp:latest
    container_name: proxyflow-warp
    restart: unless-stopped
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.all.accept_ra: "2"
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:8280:8280"
    environment:
      WARP_SLEEP: "2"
      GOST_ARGS: "-L :1080"
      WARP_ENABLE_NAT: "1"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    healthcheck:
      # Verify WARP itself through the local SOCKS endpoint.
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --max-time 10
          --socks5-hostname 127.0.0.1:1080
          https://cloudflare.com/cdn-cgi/trace
          | grep -qE 'warp=(on|plus)'
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  proxy-flow:
    image: ghcr.io/rfym21/proxy-flow:latest
    container_name: proxy-flow
    restart: unless-stopped
    depends_on:
      warp:
        condition: service_healthy
    network_mode: service:warp
    volumes:
      - ./data:/app/data
    environment:
      PROXY_PORT: "8280"
      PROXY_FILE: /app/data/proxy.txt
      PROXY_URLS: ""
      PROXY_URL_INTERVAL: "300"
      FAILURE_PROXY_FILE: /app/data/failure-proxy.txt
      MAX_IDLE_CONNS: "1000"
      MAX_IDLE_CONNS_PER_HOST: "100"
      MAX_RETRY_COUNT: "3"
      REQUEST_TIMEOUT: "30"
      AUTH_USERNAME: "${PROXYFLOW_AUTH_USERNAME:-}"
      AUTH_PASSWORD: "${PROXYFLOW_AUTH_PASSWORD:-}"
      ACCESS_LOG: "true"
      API_ENABLED: "true"
      API_PORT: "8281"
      API_KEY: ""
      CHECK_URL: https://www.cloudflare.com/cdn-cgi/trace
      CHECK_RETRY: "5"
    healthcheck:
      # Check a proxy from proxy.txt through the WARP-backed network namespace.
      test:
        - CMD-SHELL
        - >-
          wget -qO-
          'http://127.0.0.1:8281/api/get-proxy?number=1&check=true'
          | grep -q '"valid":true'
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 90s

volumes:
  warp-data:
